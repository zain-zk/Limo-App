# High5 Limo — Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: high5limo-api
    runtime: docker
    dockerfilePath: ./node/Dockerfile
    dockerContext: ./node
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: high5limo-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://high5limo.ca
      - key: CORS_ORIGIN
        value: https://high5limo.ca
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "High5 Limo <bookings@high5limo.ca>"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: high5limo-db
    plan: starter
    databaseName: limo_app
    user: limo
